<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduPanel microphone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="permission-page">
    <main class="welcome">
      <span class="welcome-logo" aria-hidden="true"></span>
      <p id="permissionTitle" class="welcome-title">Allow the microphone</p>
      <p id="permissionBody" class="permission-body">Choose <strong>Allow</strong> in Chrome's prompt so you can speak your questions to EduPanel.</p>
      <button id="permissionRetry" class="text-button" type="button" hidden>Try again</button>
    </main>
    <script type="module" src="mic-permission.js"></script>
  </body>
</html>
